{% extends "base_registration.html" %}

{% block registration_content %}

    {% csrf_token %}
    {{ form.as_p }}

</form>
<p><a href="{% url 'password_reset' %}">Забыли пароль?</a></p>
<p><a href="{% url 'accounts:signup' %}">Регистрация</a></p>
{% endblock %}
