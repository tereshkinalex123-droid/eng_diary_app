{% extends "base_registration.html" %}
{% load static %}

{% block registration_content %}
<!DOCTYPE html>
<html>
<head>
    <link type="text/css" rel="stylesheet" href="{% static 'registration/css/login.css' %}">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">🔐 Вход</h1>
            <p class="auth-subtitle">Добро пожаловать!</p>
        </div>

        <form method="post" class="auth-form">
            {% csrf_token %}

            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="errorlist">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn-submit">Войти</button>
        </form>

        <div class="auth-footer">
            <p><a href="{% url 'password_reset' %}" class="auth-link">Забыли пароль?</a></p>
            <p>Нет аккаунта? <a href="{% url 'accounts:signup' %}" class="auth-link">Регистрация</a></p>
        </div>
    </div>
</div>
</body>
</html>
{% endblock %}
