{% extends "base_registration.html" %}

{% block registration_content %}
<h1>Профиль</h1>
<a href="/">To main page</a>
<p><strong>Имя пользователя:</strong> {{ user.username }}</p>
<p><strong>Email:</strong> {{ user.email|default:"не указан" }}</p>
<p><strong>Дата регистрации:</strong> {{ user.date_joined|date:"d.m.Y" }}</p>

<a href="{% url 'accounts:profile_settings' %}">Настройки</a> |
<a href="{% url 'accounts:profile_stats' %}">Статистика</a>
{% endblock %}
