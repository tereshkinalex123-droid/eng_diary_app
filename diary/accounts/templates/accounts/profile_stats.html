{% extends "base_registration.html" %}
{% load static %}

{% block registration_content %}
<!DOCTYPE html>
<html>
<head>
    <link type="text/css" rel="stylesheet" href="{% static 'accounts/css/stats.css' %}">
</head>
<body>
<div class="stats-container">
    <div class="stats-card">
        <div class="stats-header">
            <h1 class="stats-title">📊 Статистика</h1>
            <p class="stats-subtitle">Ваш прогресс в изучении</p>
        </div>

        <div class="stats-grid">
            <div class="stats-item">
                <div class="stats-icon">📇</div>
                <div class="stats-value">{{ user.cards.count }}</div>
                <div class="stats-label">всего карточек</div>
            </div>
            <div class="stats-item">
                <div class="stats-icon">📚</div>
                <div class="stats-value">{{ user.decks.count }}</div>
                <div class="stats-label">всего колод</div>
            </div>
        </div>

        <div class="stats-footer">
            <a href="{% url 'accounts:profile' %}" class="btn-back">← Назад в профиль</a>
        </div>
    </div>
</div>
</body>
</html>
{% endblock %}
