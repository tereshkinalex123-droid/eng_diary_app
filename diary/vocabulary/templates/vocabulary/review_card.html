{% extends "base_vocabulary.html" %}

{% block vocabulary_content %}

<h2>Card {{ session.correct_answers|add:session.incorrect_answers }} of {{ session.total_cards }}</h2>

<form method="post" action="{% url 'vocabulary:end_session' session.id %}">
    {% csrf_token %}
    <button type="submit">Закончить</button>
</form>

<div class="card" id="card">
    <div class="card-inner">
        <div class="card-front">

            <h2>{{ card.front }}</h2>

            {% if card.hint %}
            <button id="show-hint">Show hint</button>

            <div id="hint" style="display:none">
                <p>{{ card.hint }}</p>
            </div>
            {% endif %}
        </div>

        <div class="card-back">
            <h2>{{ card.back }}</h2>
            <div class="rating-buttons" id="rating-buttons" style="display:none">
                <form method="post">
                    {% csrf_token %}
                    <button name="rating" value="again">Again</button>
                    <button name="rating" value="hard">Hard</button>
                    <button name="rating" value="good">Good</button>
                    <button name="rating" value="easy">Easy</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% end block %}

<script>
const card = document.getElementById("card")

if (card) {
    card.addEventListener("click", function() {

        if (!this.classList.contains("flipped")) {
            this.classList.add("flipped")

            document.getElementById("rating-buttons").style.display = "block"
        }

    })
}

const hintBtn = document.getElementById("show-hint")

if (hintBtn) {
    hintBtn.addEventListener("click", function(e) {
        e.stopPropagation()
        document.getElementById("hint").style.display = "block"
        this.style.display = "none"
    })
}

const buttons = document.querySelectorAll(".rating-buttons button")

buttons.forEach(btn => {
    btn.addEventListener("click", function(e) {
        e.stopPropagation()
    })
})
</script>
