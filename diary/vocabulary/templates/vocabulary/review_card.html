{% extends "base_vocabulary.html" %}
{% load static %}

{% block vocabulary_content %}
<!DOCTYPE html>
<html>
<head>
    <link type="text/css" rel="stylesheet" href="{% static 'vocabulary/css/review_card.css' %}">
</head>
<body>
<div class="review-container">
    <!-- Прогресс-бар -->
<!-- Исправленный блок прогресс-бара -->
    <div class="progress-wrapper">
        <div class="progress-bar-custom" style="width: {% widthratio current total 100 %}%">
            <span class="progress-text">{{ current }} / {{ total }}</span>
        </div>
    </div>

    <!-- Кнопка закончить -->
    <div class="end-review-wrapper">
        <form method="POST" action="{% url 'vocabulary:end_review' session_id %}"
              onsubmit="return confirm('Закончить повторение?')" class="end-form">
            {% csrf_token %}
            <button type="submit" class="btn-end">🏁 Закончить повторение</button>
        </form>
    </div>

    <!-- Карточка -->
    <div class="review-card">
        <div class="card-inner">
            <!-- Фронт карточки -->
            <div id="front-side" class="card-front">
                <h2 class="card-question">{{ card.front }}</h2>
                {% if card.hint %}
                    <button id="show-hint" class="btn-hint">💡 Показать подсказку</button>
                    <div id="hint-text" class="hint-text" style="display: none;">
                        {{ card.hint }}
                    </div>
                {% endif %}
                <button id="flip-card" class="btn-flip">🔄 Перевернуть карточку</button>
            </div>

            <!-- Бэк карточки -->
            <div id="back-side" class="card-back" style="display: none;">
                <h2 class="card-answer">{{ card.back }}</h2>
            </div>
        </div>
    </div>

    <!-- Форма с оценками -->
    <div id="rating-form" class="rating-section" style="display: none;">
        <form method="post" class="rating-form">
            {% csrf_token %}
            <p class="rating-title">📊 Насколько легко вы вспомнили?</p>
            <div class="rating-buttons">
                <button type="submit" name="quality" value="0" class="btn-quality q-0">0 - Забыл</button>
                <button type="submit" name="quality" value="1" class="btn-quality q-1">1 - Трудно</button>
                <button type="submit" name="quality" value="2" class="btn-quality q-2">2 - Сложно</button>
                <button type="submit" name="quality" value="3" class="btn-quality q-3">3 - Нормально</button>
                <button type="submit" name="quality" value="4" class="btn-quality q-4">4 - Легко</button>
                <button type="submit" name="quality" value="5" class="btn-quality q-5">5 - Очень легко</button>
            </div>
        </form>
    </div>
</div>

<script>
    const hintBtn = document.getElementById('show-hint');
    if (hintBtn) {
        hintBtn.onclick = function() {
            document.getElementById('hint-text').style.display = 'block';
        };
    }

    const flipBtn = document.getElementById('flip-card');
    const frontSide = document.getElementById('front-side');
    const backSide = document.getElementById('back-side');
    const ratingForm = document.getElementById('rating-form');

    flipBtn.onclick = function() {
        frontSide.style.display = 'none';
        backSide.style.display = 'block';
        ratingForm.style.display = 'block';
    };
</script>
</body>
</html>
{% endblock %}
