{% extends "base_vocabulary.html" %}
{% load static %}

{% block vocabulary_content %}
<!DOCTYPE html>
<html>
<head>
    <link type="text/css" rel="stylesheet" href="{% static 'vocabulary/css/deck_create.css' %}">
</head>
<body>
<div class="vocab-container">
    <a href="javascript:history.back()" class="back-link">← Назад</a>

    <div class="form-header">
        <h1 class="form-title">📁 Создать новую колоду</h1>
    </div>

    <form method="post" class="deck-form">
        {% csrf_token %}

        <div class="form-group">
            <label for="{{ form.name.id_for_label }}" class="form-label">{{ form.name.label_tag }}</label>
            {{ form.name.errors }}
            {{ form.name }}
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-submit">✅ Создать</button>
            <a href="javascript:history.back()" class="btn-cancel">❌ Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
{% endblock %}
