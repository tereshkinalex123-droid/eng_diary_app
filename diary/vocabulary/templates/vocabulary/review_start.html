{% extends "base_vocabulary.html" %}

{% block vocabulary_content %}

<h2>Review {% if deck %} {{ deck.name }} {% endif %}</h2>

<a href="javascript:history.back()">← Назад</a>

<form method="post">

    {% csrf_token %}

    <div class="form-group">
        {{ form.cards_count.label_tag }}
        {{ form.cards_count.errors }}
        {{ form.cards_count }}
    </div>

    <button type="submit">Start review</button>

</form>

{% endblock %}
