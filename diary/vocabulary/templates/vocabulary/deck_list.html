{% extends "base_vocabulary.html" %}
{% load static %}

{% block vocabulary_content %}
<!DOCTYPE html>
<html>
<head>
    <link type="text/css" rel="stylesheet" href="{% static 'vocabulary/css/deck_list.css' %}">
</head>
<body>
<div class="vocab-container">
    <div class="vocab-header">
        <h1 class="vocab-title">📚 Your decks</h1>
    </div>

    <div class="decks-grid">
        {% if not decks %}
            <div class="empty-state">
                <p>😢 No decks yet. Create your first deck!</p>
            </div>
        {% endif %}

        {% for deck in decks %}
            <div class="deck-card">
                <a href="{% url 'vocabulary:deck_detail' deck.slug %}" class="deck-name">
                    {{ deck.name }}
                </a>

                <div class="deck-actions">
                    <form method="POST" action="{% url 'vocabulary:review_card' deck.slug %}" class="inline-form">
                        {% csrf_token %}
                        <button type="submit" class="btn-review">🔄 Повторение</button>
                    </form>

                    <form method="POST" action="{% url 'vocabulary:deck_delete' deck.slug %}"
                          class="inline-form"
                          onsubmit="return confirm('Удалить колоду {{ deck.name|escapejs }}?');">
                        {% csrf_token %}
                        <button type="submit" class="btn-delete">🗑 Удалить</button>
                    </form>
                </div>
            </div>
        {% endfor %}
    </div>

    <div class="common-review-section">
        <form method="POST" action="{% url 'vocabulary:common_review_card' %}">
            {% csrf_token %}
            <button type="submit" class="btn-review-large">🎯 Общее повторение</button>
        </form>
    </div>
</div>
</body>
</html>
{% endblock %}
