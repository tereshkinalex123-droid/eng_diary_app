<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Дневник{% endblock %}</title>
</head>
<body>

<header>
    <h1>Дневник</h1>

    {% if user.is_authenticated %}
        <p>Вы вошли как {{ user.username }}</p>
        <nav>
            <a href="{% url 'add_record' %}">Добавить запись</a> |
            <a href="{% url 'statistics' %}">Статистика</a> |
<!--            добавить авторизированного пользователя-->
        </nav>
    {% else %}
        <nav>
            <!--            если не авторизирован-->
        </nav>
    {% endif %}
</header>

<hr>

<main>
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
