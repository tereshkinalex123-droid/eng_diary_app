{% extends "base_records.html" %}

{% block records_content %}

<h2>Редактирование: {{ record.title }}</h2>

<form method="post">
    {% csrf_token %}

    <div>
        {{ form.title.label_tag }}
        {{ form.title }}
    </div>

    <br>

    <div>
        {{ form.content.label_tag }}
        {{ form.content }}
        <small>Слов: <span id="wordCount">0</span></small>
    </div>

    <br>

<div id="tags-container">
    {% for tag in record.tags.all %}
        <label style="display:block;">
            <input type="checkbox" name="tags" value="{{ tag.id }}" checked>
            {{ tag.name }}
        </label>
    {% endfor %}
</div>

    <button type="button" onclick="toggleTagPanel()">+ Добавить тег</button>

    <div id="tag-panel" style="display:none;">

    <select id="existing-tags">
        {% for tag in all_tags %}
            <option value="{{ tag.id }}">
                {{ tag.name }}
            </option>
        {% endfor %}
    </select>

    <button type="button" onclick="addExistingTag()">Добавить</button>

    <br>

    <input type="text" id="new-tag-input" placeholder="Новый тег">
    <button type="button" onclick="addTag()">+</button>

    <hr>
    </div>

    <br>

    <button type="submit">Сохранить изменения</button>
</form>

<script>
    const textarea = document.getElementById("id_content");
    const wordCounter = document.getElementById("wordCount");

    function countWords() {
        const text = textarea.value.trim();
        const words = text ? text.split(/\s+/).length : 0;
        wordCounter.textContent = words;
    }

    // считаем сразу при загрузке
    countWords();

    // и при вводе
    textarea.addEventListener("input", countWords);
</script>

<script>
function addTag() {
    const input = document.getElementById("new-tag-input");
    const name = input.value.trim();

    if (!name) return;

    fetch("{% url 'records:create_tag' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: "name=" + encodeURIComponent(name)
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) return;

        const container = document.getElementById("tags-container");

        const label = document.createElement("label");
        label.style.display = "block";

        label.innerHTML = `
            <input type="checkbox" name="tags" value="${data.id}" checked>
            ${data.name}
        `;

        container.appendChild(label);
        input.value = "";
    });
}

function toggleTagPanel() {
    const panel = document.getElementById("tag-panel");
    panel.style.display =
        panel.style.display === "none" ? "block" : "none";
}

function addExistingTag() {
    const select = document.getElementById("existing-tags");
    const tagId = select.value;
    const tagName = select.options[select.selectedIndex].text;

    const container = document.getElementById("tags-container");

    // если уже добавлен — не добавляем
    if (document.querySelector(`input[value="${tagId}"]`)) return;

    const label = document.createElement("label");
    label.style.display = "block";
    label.innerHTML = `
        <input type="checkbox" name="tags" value="${tagId}" checked>
        ${tagName}
    `;

    container.appendChild(label);
}
</script>

{% endblock %}
